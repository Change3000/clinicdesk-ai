name: Train models and deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install scikit-learn==1.9.1 numpy scipy
      - name: Train intent model (v1 baseline, then the shipped v2)
        run: |
          python model/train.py --version v1
          python model/train.py --version v2 --export
      - name: Train urgency model
        run: python model/train_urgency.py 0.5 --export
      - name: Score the emergency rules
        run: python model/test_safety.py
      - name: Build the single-file app
        run: |
          python build.py
          mkdir -p _site
          cp dist/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
